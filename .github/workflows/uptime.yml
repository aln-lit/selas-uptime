name: uptime
# Outside check for Selas and BTC Brain. A failed run = something is down; GitHub e-mails the account that last
# changed this workflow. Public addresses only, no secrets.
on:
  schedule:
    - cron: '*/5 * * * *'     # GitHub may start scheduled runs a few minutes late
    - cron: '17 3 * * 1'      # weekly heartbeat (keeps the schedule from being paused after 60 quiet days)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node check.mjs
  heartbeat:
    if: github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > last-run.txt
          git config user.name "selas-uptime"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "heartbeat $(date -u +%F)" && git push
